spring:
  application:
    name: rivo
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routing}
    username: ${DB_USER:routing}
    password: ${DB_PASSWORD:routing}
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        jdbc.batch_size: 500
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  jackson:
    serialization:
      write-dates-as-timestamps: false

nats:
  spring:
    server: ${NATS_SERVER:nats://localhost:4222}

routing:
  graphhopper:
    local: ${GRAPHHOPPER_LOCAL:true}
    osm-file: ${GRAPHHOPPER_OSM_FILE:src/main/resources/osm/south-america-latest.osm.pbf}
    graph-location: ${GRAPHHOPPER_GRAPH_LOCATION:data/graph-cache}
    s3:
      bucket: ${GRAPHHOPPER_S3_BUCKET:routing-data}
      prefix: ${GRAPHHOPPER_S3_PREFIX:graphhopper/brazil-latest}

  optimization:
    cluster-size: 150
    time-budget-ms: 8000
    two-opt-enabled: true
    parallelism: ${ROUTING_PARALLELISM:0}
    k-nearest-matrix: 15
    k-nearest-blossom: 7
    cache:
      l1-ttl-ms: 300000
      l2-ttl-seconds: 900

  eta:
    ewma-alpha: 0.25
    min-speed-mps: 1.0
    max-speed-mps: 45.0
    signal-timeout-seconds: 20

  deviation:
    urban-threshold-meters: 40
    highway-threshold-meters: 80

  throttle:
    min-interval-seconds: 30
    max-recalc-per-minute: 2

  arrival:
    radius-meters: 20

  inactivity:
    vehicle-stopped-seconds: 120
    vehicle-abandoned-seconds: 3600

  ingestion:
    dedup-window-minutes: 2
    max-batch-size: 50
    rate-limit-per-vehicle-per-second: 20

  retry:
    max-attempts: 3
    backoff-base-ms: 1000
    backoff-multiplier: 4

  rate-limit:
    backend: ${ROUTING_RATE_LIMIT_BACKEND:redis}

  incident:
    default-zoom: 14
    rate-limit-per-minute: 5
    expire-check-ms: 60000

  auth:
    access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    remember-me-ttl-seconds: ${AUTH_REMEMBER_ME_TTL_SECONDS:2592000}
    password-reset-ttl-seconds: ${AUTH_PASSWORD_RESET_TTL_SECONDS:3600}
    issuer: ${AUTH_JWT_ISSUER:rivo}
    jwt-public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
    jwt-private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    allow-ephemeral-keys: ${AUTH_ALLOW_EPHEMERAL_KEYS:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@rivo.local}
      name: ${BOOTSTRAP_ADMIN_NAME:Owner Admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
      vehicle-id: ${BOOTSTRAP_ADMIN_VEHICLE_ID:}

resilience4j:
  circuitbreaker:
    instances:
      routeOptimization:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED

aws:
  region: ${AWS_REGION:sa-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: rivo
    distribution:
      percentiles-histogram:
        http.server.requests: true
        optimization.duration: true
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  info:
    env:
      enabled: true

info:
  app:
    name: rivo
    openapi: /v3/api-docs.yaml