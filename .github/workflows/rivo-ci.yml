name: rivo-ci

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routing_ci
          POSTGRES_USER: routing
          POSTGRES_PASSWORD: routing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routing -d routing_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: routing_ci
      DB_USER: routing
      DB_PASSWORD: routing
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NATS_SERVER: nats://localhost:4222
      AUTH_ALLOW_EPHEMERAL_KEYS: "true"
      CI_FLYWAY_URL: jdbc:postgresql://localhost:5432/routing_ci
      CI_FLYWAY_USER: routing
      CI_FLYWAY_PASSWORD: routing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Start NATS with JetStream
        run: |
          docker run -d --name rivo-nats \
            -p 4222:4222 \
            -p 8222:8222 \
            nats:2.10-alpine -js -sd /data -m 8222

      - name: Wait for NATS health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8222/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs rivo-nats
          exit 1

      - name: Build and test rivo
        working-directory: rivo
        run: mvn -B -Djava.version=25 test

      - name: Dump NATS logs on failure
        if: failure()
        run: docker logs rivo-nats

      - name: Stop NATS
        if: always()
        run: docker rm -f rivo-nats
