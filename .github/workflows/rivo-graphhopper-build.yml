name: rivo-graphhopper-build

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  GEOFABRIK_URL: https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
  S3_BUCKET: routing-data
  S3_PREFIX: graphhopper
  AWS_REGION: sa-east-1
  GH_VERSION: '9.1'

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout graphhopper infra
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rivo/infra/graphhopper

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download brazil pbf
        run: |
          mkdir -p /tmp/gh-work
          curl -L -o /tmp/gh-work/brazil.osm.pbf "$GEOFABRIK_URL"
          ls -lh /tmp/gh-work/brazil.osm.pbf

      - name: Download GraphHopper CLI
        run: |
          curl -L -o /tmp/gh-work/graphhopper-web-$GH_VERSION.jar \
            "https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/${GH_VERSION}/graphhopper-web-${GH_VERSION}.jar"

      - name: Build graph cache
        run: |
          cd /tmp/gh-work
          java -Xmx4g -jar graphhopper-web-$GH_VERSION.jar import \
            --config "$GITHUB_WORKSPACE/rivo/infra/graphhopper/config.yml"
          du -sh ./graph-cache

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload graph cache to S3
        run: |
          DATE=$(date +%Y-%m-%d)
          aws s3 sync /tmp/gh-work/graph-cache/ "s3://${S3_BUCKET}/${S3_PREFIX}/brazil-${DATE}/" --delete
          aws s3 sync /tmp/gh-work/graph-cache/ "s3://${S3_BUCKET}/${S3_PREFIX}/brazil-latest/" --delete

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/gh-work